<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5cff"/>
      <stop offset="0.55" stop-color="#5b6dfb"/>
      <stop offset="1" stop-color="#33a7ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- motion streaks (the 'motion' in Mesh2Motion) -->
  <g stroke="#ffffff" stroke-opacity="0.30" stroke-width="8" stroke-linecap="round">
    <line x1="34" y1="92"  x2="80"  y2="92"/>
    <line x1="24" y1="126" x2="86"  y2="126"/>
    <line x1="34" y1="160" x2="80"  y2="160"/>
  </g>

  <!-- running figure: bones -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="150" y1="96"  x2="132" y2="154"/> <!-- spine -->
    <line x1="146" y1="112" x2="190" y2="96"/>  <!-- front arm -->
    <line x1="146" y1="112" x2="112" y2="138"/> <!-- back arm -->
    <line x1="132" y1="154" x2="176" y2="192"/> <!-- front leg -->
    <line x1="132" y1="154" x2="98"  y2="206"/> <!-- back leg -->
  </g>

  <!-- head -->
  <circle cx="156" cy="74" r="21" fill="#ffffff"/>

  <!-- skeleton joints (yellow, like the app's joint markers) -->
  <g fill="#ffd83b" stroke="#caa400" stroke-width="2">
    <circle cx="150" cy="96"  r="9.5"/>
    <circle cx="146" cy="112" r="9.5"/>
    <circle cx="132" cy="154" r="9.5"/>
    <circle cx="190" cy="96"  r="8"/>
    <circle cx="112" cy="138" r="8"/>
    <circle cx="176" cy="192" r="8"/>
    <circle cx="98"  cy="206" r="8"/>
  </g>
</svg>
